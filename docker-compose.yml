services:
  crop-prediction-api:
    image: crop_prediction_api:latest
    build: .
    container_name: crop_prediction_api
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - MODEL_PATH=/app/models/crop_model.pkl
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crop-network

  # Optional: Add a reverse proxy with nginx for production
  nginx:
    image: nginx:alpine
    container_name: crop_prediction_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - crop-prediction-api
    restart: unless-stopped
    networks:
      - crop-network
    profiles:
      - production

networks:
  crop-network:
    driver: bridge

volumes:
  models:
  data:
  logs:
